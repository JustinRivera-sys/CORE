<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="tarjeta">
    <h1>Bienvenido de vuelta</h1>
    <p class="subtitulo">Inicia sesión para usar el chatbot</p>

    <form id="form-login">
        <label>Correo</label>
        <input type="email" id="email" required autocomplete="email">

        <label>Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit" id="btn-submit">Ingresar</button>
    </form>

    <div class="mensaje-error" id="msg-error"></div>

    <p class="enlace">¿No tienes cuenta? <a href="/register">Regístrate</a></p>
</div>

<script>
const form = document.getElementById('form-login');
const msgError = document.getElementById('msg-error');
const btn = document.getElementById('btn-submit');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgError.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Ingresando...';

    try {
        const resp = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            }),
        });
        const datos = await resp.json();
        if (!resp.ok) {
            msgError.textContent = datos.detail || 'Error al iniciar sesión.';
            msgError.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Ingresar';
            return;
        }
        window.location.href = '/chat';
    } catch (err) {
        msgError.textContent = 'No se pudo conectar con el servidor.';
        msgError.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Ingresar';
    }
});
</script>
</body>
</html>
